workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: metal key

    # Manual runs only; uncomment to build automatically on pushes to production.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: production
    #       include: true

    environment:
      flutter: stable # pin to an exact version (e.g. 3.49.0) for reproducible builds
      xcode: latest
      cocoapods: default
      groups:
        - metal_credentials
      vars:
        BUNDLE_ID: com.bwh.metal
        APP_STORE_APP_ID: 6499093482 # Apple ID from App Store Connect → App Information

    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Generate code
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Fetch App Store signing files
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          # Build number = latest TestFlight build + 1 (falls back to 1 on first upload).
          # The marketing version still comes from pubspec.yaml.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - vagbenro@gmail.com
        notify:
          success: true
          failure: true
