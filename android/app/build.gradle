plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'dev.flutter.flutter-gradle-plugin'
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

// Engine version for Flutter embedding dependency (MetalApplication extends FlutterApplication)
def engineStampFile = file("${flutterRoot}/bin/cache/engine.stamp")
def engineVersion = engineStampFile.exists() ? engineStampFile.text.trim() : ""

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasKeystore = keystorePropertiesFile.exists() &&
    keystoreProperties['keyAlias'] != null &&
    keystoreProperties['storeFile'] != null

// Fallback to default debug keystore when key.properties is missing (e.g. for local debug builds)
def debugKeystorePath = "${System.getProperty('user.home')}/.android/debug.keystore"

android {
    namespace "com.bwh.metal_app"
    compileSdk 36
    ndkVersion  "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.bwh.metal_app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        multiDexKeepProguard file('multidex-keep.pro')
        multiDexKeepFile file('main-dex-list.txt')
        consumerProguardFiles 'proguard-rules.pro'
        // Google Maps API key: add GOOGLE_MAPS_API_KEY=your_key to android/local.properties
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: localProperties.getProperty('GOOGLE_MAPS_API_KEY') ?: '',
            applicationName: 'io.flutter.embedding.android.FlutterApplication'
        ]
    }

    signingConfigs {
        debug {
            keyAlias hasKeystore ? keystoreProperties['keyAlias'] : 'androiddebugkey'
            keyPassword hasKeystore ? keystoreProperties['keyPassword'] : 'android'
            storeFile hasKeystore ? file(keystoreProperties['storeFile']) : file(debugKeystorePath)
            storePassword hasKeystore ? keystoreProperties['storePassword'] : 'android'
        }
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
            profile {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        profile {
            minifyEnabled true
            signingConfig hasKeystore ? signingConfigs.profile : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'InvalidPackage'
    }
    androidResources {
        noCompress += 'Regula/faceSdkResource.dat'
    }
}

flutter {
    source '../..'
}

dependencies {
    // Compile-only engine JAR contains io.flutter.app.FlutterApplication (v1) so MetalApplication compiles.
    // Runtime Flutter comes from Flutter plugin.
    compileOnly files("${flutterRoot}/bin/cache/artifacts/engine/android-arm64-release/flutter.jar")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.google.firebase:firebase-messaging:23.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Ensure correct version for Heytap if needed
    // implementation 'com.heytap.msp:push:2.0.6'
    implementation platform('com.google.firebase:firebase-bom:31.0.2')
    implementation 'com.google.firebase:firebase-analytics'
    // TODO: Uncomment when video calling is implemented and ZEGO repository credentials are configured
    // ZEGO dependency requires authenticated access to Heytap Maven repository
    // implementation 'im.zego:zpns-fcm:2.8.0' //ZPNs package for Google FCM push
}
