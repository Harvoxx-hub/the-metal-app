name: metal
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+9

environment:
  sdk: '>=3.0.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


 
  intl: ^0.18.0

  dartx: ^1.1.0
 
  path_provider: ^2.0.12
  flutter_riverpod: ^2.3.7
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shared_preferences: ^2.2.2
 
  provider: ^6.0.5
  cached_network_image: ^3.2.3
  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.1.9
  flutter_rating_bar: ^4.0.0
  country_pickers: ^2.0.0
  bottom_picker: ^2.2.1
  pie_chart: ^5.4.0
  dotted_border: ^2.1.0
  go_router: ^13.2.1
  image_picker: ^1.0.2
  image_cropper: ^5.0.1
  flutter_speed_dial: ^7.0.0
  dio: ^5.0.0
  pretty_dio_logger: ^1.3.1
  json_serializable: ^6.5.4
  freezed: ^2.3.2
  flutter_screenutil: ^5.7.0
  uuid: ^4.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_local_notifications: ^17.0.0
  connectivity_plus: ^5.0.2
  mask_text_input_formatter: ^2.5.0
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  flutter_localizations:
    sdk: flutter
  range_slider_flutter: ^0.0.2
  fluttertoast: ^8.2.4
  flutter_secure_storage: ^9.0.0
  geolocator: ^11.0.0
  camera: ^0.10.5+9
  video_player: ^2.8.2
  firebase_core: ^2.30.1
  
  firebase_analytics: ^10.10.3
  photo_view: ^0.14.0
  #  emoji_picker_flutter: ^2.1.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  share_plus: ^7.2.2
  another_audio_recorder: ^1.1.0
  cloud_firestore: ^4.17.1
  firebase_storage: ^11.7.3
  zego_uikit_prebuilt_call: ^4.7.3
  zego_uikit_signaling_plugin: ^2.7.6
  package_info_plus: ^7.0.0
  video_compress: ^3.1.2
  firebase_messaging: ^14.9.0




dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^3.0.1
  build_runner: ^2.3.3
  flutter_gen_runner:

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: false

flutter_launcher_icons:
  android: "launcher_icon"
  remove_alpha_ios: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

 

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/gifs/
    - assets/json/


