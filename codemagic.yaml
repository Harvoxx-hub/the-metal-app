workflows:
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable # pin to an exact version (e.g. 3.49.0) for reproducible builds
      xcode: latest
      cocoapods: default
      groups:
        # App settings > Environment variables, group "metal_credentials",
        # with these marked Secure:
        #   APP_STORE_CONNECT_PRIVATE_KEY - contents of the .p8 file for key L339PRQFC7
        #   CERTIFICATE_PRIVATE_KEY       - RSA private key (PEM) used to create/match the
        #                                   distribution certificate
        # The Apple key is read from variables instead of `integrations:
        # app_store_connect: "metal key"`, because that named lookup fails for
        # file-based builds on this team ('integration "metal key" does not exist').
        - metal_credentials
      vars:
        BUNDLE_ID: com.bwh.metal
        APP_STORE_CONNECT_KEY_IDENTIFIER: L339PRQFC7
        APP_STORE_CONNECT_ISSUER_ID: c3459740-ef56-493a-8d48-6a4d0dfd04f5
        APP_STORE_APP_ID: 6499093482 # Apple ID from App Store Connect → App Information

    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Generate code
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Fetch App Store signing files
        script: |
          set -e
          missing=""
          for name in APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "error: not set in the metal_credentials group:$missing"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          # Build number = latest TestFlight build + 1 (falls back to 1 on first upload).
          # The marketing version still comes from pubspec.yaml.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - vagbenro@gmail.com
        notify:
          success: true
          failure: true
