version: 1.0.30+91


environment:
  sdk: '>=3.0.3 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
 
  intl: ^0.19.0
  path_provider: ^2.0.12
  flutter_riverpod: ^2.3.7
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_launcher_icons: ^0.14.3
  url_launcher: ^6.1.9
  flutter_rating_bar: ^4.0.0
  country_pickers: ^3.0.1
  pie_chart: ^5.4.0
  dotted_border: ^2.1.0
  go_router: ^15.1.1
  image_picker: ^1.0.2
  dio: ^5.0.0
  pretty_dio_logger: ^1.3.1
  json_serializable: ^6.9.3
  web_socket_channel: ^3.0.1
  flutter_tts: ^4.2.2
  
  flutter_screenutil: ^5.7.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_local_notifications: ^19.1.0
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  range_slider_flutter: ^0.0.2
  fluttertoast: ^8.2.12
 
  shorebird_code_push: ^2.0.3
  geolocator: ^14.0.0
  google_maps_flutter: ^2.14.0
  place_picker_google: ^0.0.20
  camera: ^0.11.0+1
  firebase_core: ^3.6.0
  firebase_analytics: ^11.2.0
  photo_view: ^0.15.0
 
  shimmer: ^3.0.0
  flutter_ringtone_player: ^4.0.0+4
  audioplayers: ^6.4.0
 
 
 
  firebase_messaging: ^15.1.6
  
  responsive_framework: ^1.4.0
  connectivity_plus: ^6.0.3
  
  bottom_picker: ^3.0.0
  video_player: ^2.9.2
  just_the_tooltip: ^0.0.12
  emoji_picker_flutter: ^4.3.0
  share_plus: ^12.0.0
  flutter_dropzone: ^4.0.3
  cached_network_image: ^3.3.1
  timeago: ^3.7.0
  
  firebase_remote_config: ^5.1.5
  permission_handler: ^11.4.0
 
  file_picker: ^10.1.2
  cloud_functions: ^5.2.0
  
  package_info_plus: ^8.1.3
  geocoding: ^4.0.0
 
  floating: ^6.0.0
 
 
  app_links: ^6.3.2
  audio_waveforms: ^1.3.0





dependency_overrides:
  web: ^1.0.0
 
dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0
  build_runner: ^2.3.3
  flutter_gen_runner:
  freezed: ^3.0.6

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: false

flutter_launcher_icons:
  android: "launcher_icon"
  remove_alpha_ios: true
  ios: true
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo2.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo2.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo2.png"

 

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/gifs/
    - assets/json/
    - assets/env/
    - shorebird.yaml


